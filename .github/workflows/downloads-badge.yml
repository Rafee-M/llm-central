name: Update downloads badge
on:
  schedule:
    - cron: "17 3 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/readme-badges/package-lock.json
      - run: npm ci
        working-directory: tools/readme-badges
      - run: npm run generate:downloads
        working-directory: tools/readme-badges
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/readme/chip-downloads-*.svg
          git diff --cached --quiet || (git commit -m "chore: update downloads badge" && git push)
