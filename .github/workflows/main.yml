name: Android CI

# Builds the app and runs the unit tests on every push/PR to master, so a broken change is noticed
# before it is merged. (The old workflow listened to branch "main", which doesn't exist here, and used
# JDK 16, which the Android Gradle Plugin 8.x cannot run on — so it never ran.)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows running the workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Unit tests (JVM) + lint + debug and release APKs. The release APK is unsigned in CI.
      - name: Test, lint and build
        run: ./gradlew test lint assembleDebug assembleRelease

      - name: Report release APK size
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          echo "Release APK size: $(stat -c %s "$APK") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
