<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About LLM Central</title>
    <!--
        Settings → About (opened by ui/AboutWindow.java in its own full-screen window).

        HOW TO CHANGE THIS PAGE (see also CHANGES.md, entry "About window"):
          - Developer name, GitHub address, licence text: edit the rows in <main> below.
          - App name and version come from the app (build.gradle versionName, strings.xml app_name),
            the icon from the launcher icon; they arrive through AndroidAbout.info() as JSON.
          - Colours: the --md-* variables follow the app's theme (the <style id="app-theme"> block added
            at the end of <head>, as in settings.html). Use them instead of fixed colours.
          - Links open in the browser (web/DialogWebViewClient), never inside the app.
        Try it in a desktop browser: open this file; without the app it shows a placeholder icon.
    -->
    <style>
        :root {
            --md-primary: #65558F;
            --md-secondary-container: #E8DEF8; --md-on-secondary-container: #4A4458;
            --md-surface: #FDF7FF; --md-on-surface: #1D1B20; --md-on-surface-variant: #49454F;
            --md-surface-container: #F3EDF7;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --md-primary: #D0BCFE;
                --md-secondary-container: #4A4458; --md-on-secondary-container: #E8DEF8;
                --md-surface: #141218; --md-on-surface: #E6E0E9; --md-on-surface-variant: #CAC4D0;
                --md-surface-container: #211F26;
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { background: var(--md-surface); }
        body {
            font-family: "Google Sans Text", "Google Sans", Roboto, system-ui, sans-serif;
            color: var(--md-on-surface); font-size: 16px; line-height: 1.4; min-height: 100vh;
        }
        svg { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; }

        .appbar { display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 4px; }
        .appbar h1 { font-size: 22px; font-weight: 400; margin-left: 4px; }
        .icon-btn {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: 48px; height: 48px; border-radius: 50%; border: 0; background: transparent;
            color: var(--md-on-surface-variant); cursor: pointer;
        }

        main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
        .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin: 16px 0 32px; }
        .hero img, .hero .placeholder { width: 96px; height: 96px; }
        .hero .placeholder { border-radius: 28px; background: var(--md-secondary-container); }
        .hero h2 { font-size: 28px; font-weight: 400; margin-top: 8px; }
        .version {
            font-size: 14px; font-weight: 500; padding: 4px 12px; border-radius: 8px;
            background: var(--md-secondary-container); color: var(--md-on-secondary-container);
        }

        .group { display: flex; flex-direction: column; gap: 2px; }
        .row {
            position: relative; overflow: hidden; display: flex; align-items: center; gap: 16px;
            min-height: 72px; padding: 12px 16px; background: var(--md-surface-container);
            border-radius: 4px; color: inherit; text-decoration: none;
        }
        .group > .row:first-child { border-top-left-radius: 24px; border-top-right-radius: 24px; }
        .group > .row:last-child { border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; }
        .row > svg { color: var(--md-on-surface-variant); }
        .text { flex: 1; min-width: 0; }
        .title { font-size: 16px; }
        .sub { font-size: 14px; color: var(--md-on-surface-variant); margin-top: 2px; overflow-wrap: anywhere; }
        a.row .sub { color: var(--md-primary); }
        /* Touch feedback ("state layer"), as in settings.html. */
        a.row::after, .icon-btn::after {
            content: ""; position: absolute; inset: 0; border-radius: inherit;
            background: currentColor; opacity: 0; transition: opacity .15s; pointer-events: none;
        }
        a.row:active::after, .icon-btn:active::after { opacity: .1; }
        :focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }
    </style>
    <!-- App theme (palette / Material You / dark mode) from theme/ThemeBridge; must stay last in <head>. -->
    <script>if (window.AndroidTheme) { document.write('<style id="app-theme">' + AndroidTheme.css() + '</style>'); }</script>
</head>
<body>
    <header class="appbar">
        <button type="button" class="icon-btn" onclick="closeAbout()" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1>About</h1>
    </header>

    <main>
        <!-- App icon, name and version (filled in from AndroidAbout.info() below). -->
        <div class="hero">
            <div class="placeholder" id="icon" role="img" aria-label="App icon"></div>
            <h2 id="appName">LLM Central</h2>
            <span class="version" id="version" hidden></span>
        </div>

        <div class="group">
            <div class="row">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <div class="text"><div class="title">Developed by</div><div class="sub">Rafee-M</div></div>
            </div>
            <a class="row" href="https://github.com/Rafee-M/llm-central">
                <svg viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
                <div class="text"><div class="title">Source code on GitHub</div><div class="sub">github.com/Rafee-M/llm-central</div></div>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            </a>
            <div class="row">
                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                <div class="text"><div class="title">Licence</div><div class="sub">Free software under the GNU GPL v3</div></div>
            </div>
        </div>
    </main>

    <script>
        const ABOUT = window.AndroidAbout;
        function closeAbout() { if (ABOUT) ABOUT.close(); else history.back(); }

        // Fill in what only the app knows. Everything is set with textContent / src, never as HTML.
        (function () {
            if (!ABOUT) return;
            let info = {};
            try { info = JSON.parse(ABOUT.info()); } catch (e) { return; }
            if (info.name) document.getElementById('appName').textContent = info.name;
            if (info.version) {
                const v = document.getElementById('version');
                v.textContent = 'Version ' + info.version;
                v.hidden = false;
            }
            if (info.icon) {
                const img = document.createElement('img');
                img.src = info.icon;
                img.alt = 'App icon';
                document.getElementById('icon').replaceWith(img);
            }
        })();
    </script>
</body>
</html>
