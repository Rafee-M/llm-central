plugins {
    id 'com.android.application'
}

// Force JVM to use Unix line endings (LF) for service files and resources generated during the build
System.setProperty("line.separator", "\n")

android {
    // Gradle 8.13+ wants "name = value" (with '='); the old "name value" form is deprecated.
    // compileSdk = which Android API version the code is compiled against (lets us *use* newer APIs,
    // behind version checks). It does not change how the app behaves; targetSdk below does.
    compileSdk = 36
    namespace = 'org.llmcentral.app'
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        // applicationId = the app's permanent identity on a phone and in app stores.
        // Android treats a different applicationId as a completely different app, so never
        // change it after the first public release (users would lose their data and updates).
        applicationId = "org.llmcentral.app"
        minSdk = 24
        // targetSdk stays 35 on purpose: raising it changes Android behaviour (back gesture, large screens...)
        // and needs testing on a phone first. Lint's "OldTargetApi" warning about it is expected.
        targetSdk = 35
        // New app identity → version numbering restarts (duckAssist was at 251 / 0.4.6).
        // versionCode must increase with every release; versionName is what users see.
        versionCode = 1
        versionName = "1.0.0"
        manifestPlaceholders = [appName: "@string/app_name"]

        // Only package translations the app actually has (en = default "values/").
        // Libraries ship strings for ~90 languages; dropping unused ones saved ~113 KB (see CHANGES.md).
        // Add the locale here when a new translation folder (values-xx) is added.
        // (German 'de' was listed until 2026-10-15 without a values-de folder; it kept nothing, VERIFICATION O-L1.)
        resourceConfigurations += ['en', 'nl', 'pt-rBR', 'tr', 'zh-rCN', 'zh-rTW']
    }

    signingConfigs {
        // Debug builds are signed with this fixed, committed key (password "android", like Android's default).
        // Without it, every CI machine creates a random debug key, and Android refuses to install a debug APK
        // over one signed with a different key ("App not installed"), forcing an uninstall that deletes app data.
        // Debug keys are not secret. The real release key is never committed (see "release" below).
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        release {
            // Optional local signing for your own testing only. Public releases are built UNSIGNED and
            // signed afterwards with apksigner 34 by .github/workflows/release.yml: a Gradle-signed APK
            // fails F-Droid's reproducible-build check (tested with apksigcopier; see RELEASE.md).
            // Load signing properties from local.properties
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withInputStream { localProperties.load(it) }
            }

            def storeFileProp = localProperties.getProperty('signing.storeFile')
            if (storeFileProp != null) {
                storeFile = rootProject.file(storeFileProp)
                storePassword = localProperties.getProperty('signing.storePassword')
                keyAlias = localProperties.getProperty('signing.keyAlias')
                keyPassword = localProperties.getProperty('signing.keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            manifestPlaceholders = [appName: "LLM Central (Debug)"]
        }
        release {
            manifestPlaceholders = [appName: "@string/app_name"]
            debuggable = false
            // R8: removes unused code and shortens class names.
            minifyEnabled = true
            // Removes resources (images, layouts, strings) that no code references. Needs minifyEnabled.
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def releaseSigning = signingConfigs.findByName('release')
            if (releaseSigning != null && releaseSigning.storeFile != null) {
                signingConfig = releaseSigning
            }
        }
    }

    dependenciesInfo {
        // Disabling dependency metadata helps ensure byte-for-byte build reproducibility on F-Droid
        includeInApk = false
        includeInBundle = false
    }

    packaging {
        resources {
            excludes += '/assets/dexopt/baseline.prof'
            excludes += '/assets/dexopt/baseline.profm'
            // Kotlin metadata files pulled in by androidx.webkit's Kotlin dependency. They are only read
            // by Kotlin reflection, which this Java-only app never uses.
            excludes += '/kotlin/**'
            excludes += '/META-INF/*.kotlin_module'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    
    // 'lint { }' replaces the old 'lintOptions { }' block (removed in newer plugin versions).
    lint {
        disable += ['MissingTranslation'] // Translation is crowd-sourced, so this lint warning is useless
    }
}

dependencies {
    // AndroidX WebKit: newer WebView features (profiles, message listeners, …) with version checks.
    implementation 'androidx.webkit:webkit:1.17.1'
    // Removed: FreeDroidWarn (pulled in AppCompat + Kotlin, ~435 KB) and swiperefreshlayout (never used).

    // Unit tests run on the computer (JVM), not the phone, and are not packaged into the APK.
    testImplementation 'junit:junit:4.13.2'
    // In JVM tests Android's own classes are empty stubs, including org.json. This real copy of the same
    // library lets AccountStoreTest/PalettesTest read and write JSON. Test-only: not in the APK.
    testImplementation 'org.json:json:20260814'
}
